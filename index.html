<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALC</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="calculator-solid.svg" type="image/x-icon">
</head>

<body>
    <main>
        <div class="contenedor__general">

            <div class="titulo">
                <span>Calc</span>
            </div>

            <div class="pantalla">
                <span></span>
            </div>

            <div class="teclas">
                <button class="signo signoAC">AC</button>
                <button class="signo cambioSigno">+/-</button>
                <button class="signo operador">%</button>
                <button class="signo operador">/</button>
            </div>

            <div class="teclas">
                <button class="numero">7</button>
                <button class="numero">8</button>
                <button class="numero">9</button>
                <button class="signo operador">x</button>
            </div>

            <div class="teclas">
                <button class="numero">4</button>
                <button class="numero">5</button>
                <button class="numero">6</button>
                <button class="signo operador">-</button>
            </div>

            <div class="teclas">
                <button class="numero">1</button>
                <button class="numero">2</button>
                <button class="numero">3</button>
                <button class="signo operador">+</button>
            </div>

            <div class="teclas">
                <button class="signo signoDel">DEL</button>
                <button class="numero">0</button>
                <button class="punto">.</button>
                <button class="igual">=</button>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
